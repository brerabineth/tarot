name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install zig 0.14.1
        shell: bash
        run: |
          set -e
          case "${{ runner.os }}/${{ runner.arch }}" in
            Linux/X64)    f=zig-x86_64-linux-0.14.1.tar.xz ;;
            macOS/ARM64)  f=zig-aarch64-macos-0.14.1.tar.xz ;;
            macOS/X64)    f=zig-x86_64-macos-0.14.1.tar.xz ;;
            Windows/X64)  f=zig-x86_64-windows-0.14.1.zip ;;
            *) echo "unsupported runner: ${{ runner.os }}/${{ runner.arch }}"; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o /tmp/zigpkg "https://ziglang.org/download/0.14.1/$f"
          mkdir -p "$HOME/.zig"
          case "${{ runner.os }}" in
            Windows) unzip -q /tmp/zigpkg -d "$HOME/.zig" ;;
            *)       tar -xf /tmp/zigpkg -C "$HOME/.zig" ;;
          esac
          dir="${f%.tar.xz}"; dir="${dir%.zip}"
          echo "$HOME/.zig/$dir" >> "$GITHUB_PATH"
      - name: toolchain check
        run: zig version
      - name: unit tests
        run: zig build test
      - name: build (release-safe)
        run: zig build -Doptimize=ReleaseSafe
      - name: e2e (unix)
        if: runner.os != 'Windows'
        run: bash test/e2e_local.sh
      - name: e2e (windows smoke)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./zig-out/bin/tarot.exe forge clean clean.tar
          ./zig-out/bin/tarot.exe scan clean.tar --quiet
          if ($LASTEXITCODE -ne 0) { Write-Error "clean should exit 0"; exit 1 }
          ./zig-out/bin/tarot.exe forge worm worm.tar
          ./zig-out/bin/tarot.exe scan worm.tar --quiet
          if ($LASTEXITCODE -ne 2) { Write-Error "worm should exit 2"; exit 2 }
          ./zig-out/bin/tarot.exe forge traversal t.tar
          ./zig-out/bin/tarot.exe scan t.tar --json
          if ($LASTEXITCODE -ne 2) { Write-Error "traversal should exit 2"; exit 2 }
          Write-Host "windows smoke OK"
