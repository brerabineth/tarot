name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig 0.14.1
        run: |
          set -e
          f=zig-x86_64-linux-0.14.1.tar.xz
          curl -fsSL --retry 3 -o /tmp/zigpkg "https://ziglang.org/download/0.14.1/$f"
          mkdir -p "$HOME/.zig"
          tar -xf /tmp/zigpkg -C "$HOME/.zig"
          echo "$HOME/.zig/${f%.tar.xz}" >> "$GITHUB_PATH"
      - name: toolchain check
        run: zig version
      - name: unit tests
        run: zig build test
      - name: build (release-safe)
        run: zig build -Doptimize=ReleaseSafe
      - name: e2e
        run: bash test/e2e_local.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig 0.14.1
        shell: bash
        run: |
          set -e
          f=zig-x86_64-windows-0.14.1.zip
          curl -fsSL --retry 3 -o /tmp/zigpkg "https://ziglang.org/download/0.14.1/$f"
          mkdir -p "$HOME/.zig"
          unzip -q /tmp/zigpkg -d "$HOME/.zig"
          echo "$(cygpath -w "$HOME/.zig/${f%.zip}")" >> "$GITHUB_PATH"
      - name: unit tests
        run: zig build test
      - name: build (release-safe)
        run: zig build -Doptimize=ReleaseSafe
      - name: windows smoke
        shell: pwsh
        run: |
          ./zig-out/bin/tarot.exe forge clean clean.tar
          ./zig-out/bin/tarot.exe scan clean.tar --quiet
          if ($LASTEXITCODE -ne 0) { Write-Error "clean should exit 0"; exit 1 }
          ./zig-out/bin/tarot.exe forge worm worm.tar
          ./zig-out/bin/tarot.exe scan worm.tar --quiet
          if ($LASTEXITCODE -ne 2) { Write-Error "worm should exit 2"; exit 2 }
          ./zig-out/bin/tarot.exe forge traversal t.tar
          ./zig-out/bin/tarot.exe scan t.tar --json
          if ($LASTEXITCODE -ne 2) { Write-Error "traversal should exit 2"; exit 2 }
          Write-Host "windows smoke OK"
          exit 0

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig 0.14.1
        run: |
          set -e
          f=zig-x86_64-linux-0.14.1.tar.xz
          curl -fsSL --retry 3 -o /tmp/zigpkg "https://ziglang.org/download/0.14.1/$f"
          mkdir -p "$HOME/.zig"
          tar -xf /tmp/zigpkg -C "$HOME/.zig"
          echo "$HOME/.zig/${f%.tar.xz}" >> "$GITHUB_PATH"
      - name: cross-compile (macos aarch64/x86_64, linux aarch64)
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos
          file zig-out/bin/tarot
          rm -rf zig-out .zig-cache
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos
          file zig-out/bin/tarot
          rm -rf zig-out .zig-cache
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-musl
          file zig-out/bin/tarot
