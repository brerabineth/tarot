name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig 0.14.1
        run: |
          set -e
          f=zig-x86_64-linux-0.14.1.tar.xz
          curl -fsSL --retry 3 -o /tmp/zigpkg "https://ziglang.org/download/0.14.1/$f"
          mkdir -p "$HOME/.zig"
          tar -xf /tmp/zigpkg -C "$HOME/.zig"
          echo "$HOME/.zig/${f%.tar.xz}" >> "$GITHUB_PATH"
      - name: verify before shipping
        run: |
          zig build test
          zig build -Doptimize=ReleaseSafe
          bash test/e2e_local.sh
      - name: build linux + macos targets
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl
          cp zig-out/bin/tarot tarot-linux-x86_64
          rm -rf zig-out .zig-cache
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-musl
          cp zig-out/bin/tarot tarot-linux-aarch64
          rm -rf zig-out .zig-cache
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos
          cp zig-out/bin/tarot tarot-macos-aarch64
          rm -rf zig-out .zig-cache
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos
          cp zig-out/bin/tarot tarot-macos-x86_64
          rm -rf zig-out .zig-cache
      - uses: actions/upload-artifact@v4
        with:
          name: unix-binaries
          path: tarot-*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig 0.14.1
        shell: bash
        run: |
          set -e
          f=zig-x86_64-windows-0.14.1.zip
          curl -fsSL --retry 3 -o /tmp/zigpkg "https://ziglang.org/download/0.14.1/$f"
          mkdir -p "$HOME/.zig"
          unzip -q /tmp/zigpkg -d "$HOME/.zig"
          echo "$(cygpath -w "$HOME/.zig/${f%.zip}")" >> "$GITHUB_PATH"
      - name: verify before shipping
        shell: pwsh
        run: |
          zig build test
          zig build -Doptimize=ReleaseSafe
          ./zig-out/bin/tarot.exe forge worm worm.tar
          ./zig-out/bin/tarot.exe scan worm.tar --quiet
          if ($LASTEXITCODE -ne 2) { Write-Error "worm should exit 2"; exit 2 }
          Write-Host "windows verify OK"
          exit 0
      - name: stage artifact
        shell: bash
        run: cp zig-out/bin/tarot.exe tarot-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tarot-windows-x64.exe
          path: tarot-windows-x64.exe

  publish:
    needs: [unix, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: checksums
        run: |
          cd dist
          sha256sum tarot-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tarot-*
            dist/SHA256SUMS
