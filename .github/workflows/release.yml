name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, osarch: Linux/X64, target: x86_64-linux-musl, artifact: tarot-linux-x86_64 }
          - { os: ubuntu-latest, osarch: Linux/X64, target: aarch64-linux-musl, artifact: tarot-linux-aarch64 }
          - { os: macos-latest, osarch: macOS/ARM64, target: aarch64-macos, artifact: tarot-macos-aarch64 }
          - { os: macos-latest, osarch: macOS/X64, target: x86_64-macos, artifact: tarot-macos-x86_64 }
          - { os: windows-latest, osarch: Windows/X64, target: x86_64-windows, artifact: tarot-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install zig 0.14.1
        shell: bash
        run: |
          set -e
          case "${{ matrix.osarch }}" in
            Linux/X64)    f=zig-x86_64-linux-0.14.1.tar.xz ;;
            macOS/ARM64)  f=zig-aarch64-macos-0.14.1.tar.xz ;;
            macOS/X64)    f=zig-x86_64-macos-0.14.1.tar.xz ;;
            Windows/X64)  f=zig-x86_64-windows-0.14.1.zip ;;
            *) echo "unsupported: ${{ matrix.osarch }}"; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o /tmp/zigpkg "https://ziglang.org/download/0.14.1/$f"
          mkdir -p "$HOME/.zig"
          case "${{ runner.os }}" in
            Windows) unzip -q /tmp/zigpkg -d "$HOME/.zig" ;;
            *)       tar -xf /tmp/zigpkg -C "$HOME/.zig" ;;
          esac
          dir="${f%.tar.xz}"; dir="${dir%.zip}"
          case "${{ runner.os }}" in
            Windows) echo "$(cygpath -w "$HOME/.zig/$dir")" >> "$GITHUB_PATH" ;;
            *)       echo "$HOME/.zig/$dir" >> "$GITHUB_PATH" ;;
          esac
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          fi
      - name: verify before shipping (unix)
        if: runner.os != 'Windows'
        run: |
          zig build test
          zig build -Doptimize=ReleaseSafe
          bash test/e2e_local.sh
      - name: verify before shipping (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          zig build test
          zig build -Doptimize=ReleaseSafe
          ./zig-out/bin/tarot.exe forge worm worm.tar
          ./zig-out/bin/tarot.exe scan worm.tar --quiet
          if ($LASTEXITCODE -ne 2) { Write-Error "worm should exit 2"; exit 2 }
      - name: build target
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - name: stage artifact
        shell: bash
        run: |
          set -e
          ART="${{ matrix.artifact }}"
          if [ -f zig-out/bin/tarot ]; then cp zig-out/bin/tarot "$ART";
          elif [ -f zig-out/bin/tarot.exe ]; then cp zig-out/bin/tarot.exe "$ART";
          else echo "no binary produced"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: checksums
        run: |
          cd dist
          sha256sum tarot-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tarot-*
            dist/SHA256SUMS
